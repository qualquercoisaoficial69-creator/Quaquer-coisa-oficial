<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualquer Coisa Rápido | Estúdio Indie</title>
    <meta name="description" content="Site oficial da Qualquer Coisa Rápido, estúdio indie por trás do jogo Unique Soul.">
    <meta name="theme-color" content="#2d0a4e">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Qualquer Coisa Rápido | Estúdio Indie">
    <meta property="og:description" content="Conheça o estúdio indie Qualquer Coisa Rápido e acompanhe o desenvolvimento de Unique Soul.">
    <meta property="og:image" content="imagens/preview.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="imagens/favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
</head>
<body class="splash-body">

    <!-- Tela de Carregamento: Logo com Spinner -->
    <div class="site-intro" id="siteIntro" aria-live="polite" aria-label="Carregando Qualquer Coisa Rápido">
        <div class="intro-loading-stage" data-intro-loading-stage>
            <img src="imagens/Logo_colorida.png" alt="Logo da Qualquer Coisa Rápido" class="intro-loading-logo">
            <div class="intro-spinner" aria-hidden="true"></div>
            <p class="intro-loading-text">Carregando...</p>
        </div>
    </div>

    <!-- Tela com Logo e Botão Press for Start -->
    <main class="splash-container">
        <div class="splash-card">
            <div class="splash-logo">
                <img src="imagens/Logo_colorida.png" alt="Logo da Qualquer Coisa Rápido" class="splash-logo-img">
            </div>

            <h1 class="splash-title">Qualquer Coisa <span>Rápido</span></h1>
            <p class="splash-subtitle">Estúdio Indie de Games</p>

            <div class="splash-divider"></div>

            <a href="home.html" class="btn-start" aria-label="Entrar no site da Qualquer Coisa Rápido">
                <i class="fas fa-play" aria-hidden="true"></i> PRESS FOR START
            </a>
        </div>
    </main>

    <script src="scripts/script.js"></script>
</body>
</html>
